name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/deploy-pages.yml"
      - "docs/multi-harness-ssot.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Root deploy for custom domain toolkits.chimeranext.dev (CNAME in public/).
      # Leave repository variable PAGES_BASE_PATH unset (or empty). Set it to
      # /better-toolkits only for a temporary project-URL deploy without DNS.
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
      - run: |
          touch out/.nojekyll
          # Ensure CNAME lands in the Pages artifact (Next copies public/ → out/)
          test -f out/CNAME || cp public/CNAME out/CNAME
          cat out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
