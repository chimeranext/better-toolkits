# Bypass audit — detecta merges a main que pasaron por encima del check
# `megalinter` (bypass) y persiste un receipt en el repo interno
# `internal-audits` (política internal-audits, ver governance SSOT).
#
# Nota: este workflow corre en cada push a main para auditar el merge. No es
# un gate de merge (no bloquea); es una evidencia para la métrica bypass rate.
# Requiere configurar el secret AUDIT_GIT_TOKEN si se desea persistir receipts.

name: bypass audit

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit bypasses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDIT_GIT_TOKEN: ${{ secrets.AUDIT_GIT_TOKEN }}
          AUDIT_REPO: chimeranext/internal-audits
        run: bash scripts/ci/audit-bypass.sh
