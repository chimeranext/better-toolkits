# MegaLinter — agregador de gates de calidad (SSOT .mega-linter.yml).
# Incluye el typecheck (tsc --noEmit) como PRE_COMMAND bloqueante.
# Evidencia: SARIF (se puede subir como code scanning).

name: megalinter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oxsecurity/megalinter@v10
        env:
          VALIDATE_ALL_CODEBASE: "false" # PR: solo archivos del diff; push main: todo
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MegaLinter reports (SARIF/JSON/MD)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: megalinter-reports/
