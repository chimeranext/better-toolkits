name: skills-catalog-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills catalog matches on-disk skill folders
        run: python3 scripts/ci/check-skills-catalog.py
      - name: Toolkit changes require marketplace version bump
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/marketplace_versioning.py check --range origin/main...HEAD
