name: skills-catalog-check

# Single trigger set that never double-runs the same head: `pull_request`
# covers PR heads (the unit of review), `push` is scoped to main so a merged
# PR is re-checked exactly once. `concurrency` + `cancel-in-progress` cancels
# superseded runs of the same workflow/ref (see design: no duplicate check-runs
# per head).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skills-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills catalog matches on-disk skill folders
        run: python3 scripts/ci/check-skills-catalog.py
      - name: Toolkit changes require marketplace version bump
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/marketplace_versioning.py check --range origin/main...HEAD
