# SSOT bandit (gate /assurance).
#
# B101 (assert_used) se excluye del gate de forma deliberada: los asserts de
# este monorepo son intencionales y forman el harness de self-test de scripts de
# lint (p.ej. asd-ste100-lint.py). No son guardas de seguridad de runtime que se
# pierdan por optimización (-O); marcarlos como vulnerabilidad es un falso
# positivo que bloquearía CI sin riesgo real.
#
# B404, B603 y B607 saltan en cada subprocess.run de un argv fijo (gh, git)
# sin shell=True. La ruta absoluta del binario no es conocida en el repo.
# B602 (shell=True) sigue activo.
skips:
  - B101
  - B404
  - B603
  - B607
