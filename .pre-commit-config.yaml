# better-toolkits — install: pre-commit install && pre-commit install --hook-type pre-push
repos:
  - repo: local
    hooks:
      - id: marketplace-version-sync
        name: marketplace.json matches plugin.json versions
        entry: python3 scripts/ci/marketplace_versioning.py sync
        language: system
        pass_filenames: false
        always_run: true
      - id: marketplace-version-check-push
        name: toolkit changes require marketplace version bump (pre-push)
        entry: python3 scripts/ci/marketplace_versioning.py check --range origin/main..HEAD
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: better-profile-sync-check
        name: repo better.md in sync with ~/.config/opencode/agents/better.md
        entry: bash scripts/ci/sync-better-profile.sh --check --quiet
        language: system
        pass_filenames: false
        always_run: true
      - id: no-stale-deprecated-shims
        name: no deprecated command/script shims in touched agent paths
        entry: bash scripts/lint/check-no-stale-deprecated-shims.sh
        language: system
        files: ^(toolkits/[^/]+/(commands|scripts)/|shared/bootstrap/(commands|scripts)/|\.cursor/commands/).+\.(md|sh)$
      - id: no-hardcoded-checksum
        name: no hardcoded sha256 checksum in setup scripts
        entry: python3 scripts/lint/detect_hardcoded_checksum.py
        language: system
        files: ^shared/bootstrap/scripts/setup-.*\.sh$
      - id: code-smells
        name: cross-language code smells (HARD on changed files)
        entry: python3 scripts/lint/detect_code_smells.py
        language: system
        pass_filenames: true
      - id: skills-catalog-check
        name: skills catalog matches on-disk skill folders
        entry: python3 scripts/ci/check-skills-catalog.py
        language: system
        pass_filenames: false
        always_run: true
      - id: skills-catalog-check-postcommit
        name: skills catalog post-commit advisory
        entry: python3 scripts/ci/check-skills-catalog-advisory.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
